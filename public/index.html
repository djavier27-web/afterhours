<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>After Hours - Interactive AU Simulator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts Inter & Playfair -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0d0e12;
      color: #e2e8f0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Container utama bergaya Phone Display / AU Frame */
    .au-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 430px;
      background-color: #121318;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(99, 102, 241, 0.15);
    }

    @media (min-width: 500px) and (min-height: 700px) {
      .au-container {
        height: 92vh;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    }

    /* Custom Scrollbar minimalis */
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* Bubble Chat Styling */
    .chat-bubble-user {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .chat-bubble-model {
      background-color: #1e2029;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
    }

    /* Transition Screens */
    .screen-view {
      transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
      width: 100%;
      height: 100%;
    }

    .serif-font {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body>

  <div class="au-container">

    <!-- HEADER / NAVIGATION BAR -->
    <header class="w-full px-5 py-4 bg-[#121318]/90 backdrop-blur-md border-b border-white/10 z-40 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button id="btn-back" onclick="showScreen('chats')" class="text-gray-400 hover:text-white transition hidden text-sm">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div>
          <h1 id="header-title" class="text-sm font-bold tracking-wide text-white">After Hours AU</h1>
          <p id="header-sub" class="text-[10px] text-indigo-400 font-medium">Misi 1: Salah Kirim Boba</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Badge Misi -->
        <span id="mission-badge" onclick="toggleMissionModal()" class="cursor-pointer text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-full font-semibold hover:bg-indigo-500/20 transition">
          Misi 1 / 8
        </span>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="relative flex-1 w-full h-full overflow-hidden">

      <!-- VIEW 1: DAFTAR CHAT KARAKTER -->
      <section id="screen-chats" class="screen-view absolute inset-0 flex flex-col z-20 bg-[#121318]">
        <!-- Banner Cerita Singkat -->
        <div class="p-4 mx-4 mt-4 bg-gradient-to-r from-indigo-950/40 to-slate-900/40 border border-indigo-500/20 rounded-2xl">
          <h2 class="serif-font italic text-sm text-indigo-200 mb-1">Pesan Masuk</h2>
          <p id="au-status-desc" class="text-[11px] text-gray-400 leading-relaxed">
            Sapa Rian di WhatsApp mengenai boba Earl Grey yang salah kirim ke rumahmu.
          </p>
        </div>

        <!-- List Kontak Chat -->
        <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-2" id="character-list">
          <!-- Item Kontak di-render via JS -->
        </div>
      </section>

      <!-- VIEW 2: RUANG OBROLAN (CHAT ROOM) -->
      <section id="screen-room" class="screen-view absolute inset-0 hidden flex-col z-30 bg-[#0d0e12]">
        
        <!-- Messages Area -->
        <div id="messages-container" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3">
          <!-- Bubble Chat di-render via JS -->
        </div>

        <!-- Input Chat Bar -->
        <form id="chat-form" onsubmit="handleSend(event)" class="p-3 bg-[#121318] border-t border-white/10 flex items-center space-x-2">
          <input 
            id="chat-input" 
            type="text" 
            placeholder="Ketik balasan..." 
            autocomplete="off"
            class="flex-1 bg-[#1a1c24] text-white text-xs rounded-xl px-4 py-3 focus:outline-none focus:ring-1 focus:ring-indigo-500 placeholder-gray-500 border border-white/5"
          />
          <button type="submit" class="w-10 h-10 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl flex items-center justify-center text-xs transition active:scale-95 shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>

      </section>

    </main>

    <!-- MISSION LOG MODAL -->
    <div id="mission-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
      <div class="bg-[#181a22] border border-white/10 rounded-2xl p-5 w-full max-w-xs space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
          <h3 class="text-xs font-bold text-indigo-300">LOG ALUR CERITA</h3>
          <button onclick="toggleMissionModal()" class="text-gray-400 text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="space-y-2 max-h-60 overflow-y-auto custom-scroll" id="mission-selector-list">
          <!-- List pilihan Misi 1-8 -->
        </div>
      </div>
    </div>

  </div>

  <!-- LOGIK SHIFTED JAVASCRIPT -->
  <script>
    // GAME STATE
    let currentMission = 1;
    let activeCharId = null;

    // CONFIG KARAKTER (DISESUAIKAN DENGAN API GROQ)
    const CHARACTERS = {
      rian: { id: "rian", name: "Rian Pratama", role: "Desainer Grafis", avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?q=80&w=200&auto=format&fit=crop", unlockedAt: 1 },
      siti: { id: "siti", name: "Siti", role: "Sahabat", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=200&auto=format&fit=crop", unlockedAt: 2 },
      dimas: { id: "dimas", name: "Dimas", role: "Sahabat Rian", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop", unlockedAt: 3 },
      ibu: { id: "ibu", name: "Ibu", role: "Orang Tua", avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=200&auto=format&fit=crop", unlockedAt: 4 },
      maya: { id: "maya", name: "Maya", role: "Rekan Kerja", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop", unlockedAt: 5 }
    };

    // ALUR MISI AU
    const MISSIONS = {
      1: { title: "Misi 1", desc: "Sapa Rian di WhatsApp mengenai boba Earl Grey yang salah kirim." },
      2: { title: "Misi 2", desc: "Ngobrol di WhatsApp tentang boba dan postingan X." },
      3: { title: "Misi 3", desc: "Menerima martabak manis lewat ojol dari Rian." },
      4: { title: "Misi 4", desc: "Panggilan telepon pertama dengan Rian." },
      5: { title: "Misi 5", desc: "Janjian kencan pertama di Kopi Nanti." },
      6: { title: "Misi 6", desc: "Ngobrol setelah melewati kencan pertama." },
      7: { title: "Misi 7", desc: "Kesalahpahaman dengan Maya sudah selesai." },
      8: { title: "Misi 8", desc: "Kencan romantis di Pantai Senja." }
    };

    // RIWAYAT CHAT
    const chatHistories = {
      rian: [{ sender: 'model', text: 'Halo! Kirana salah kasih nomor, ini boba Earl Grey kamu ya?' }],
      siti: [{ sender: 'model', text: 'Eh kamu beneran dikirimin boba sama cowok ganteng?' }],
      dimas: [{ sender: 'model', text: 'Wkwk si Rian emang suka ngaco kalau kirim makanan.' }],
      ibu: [{ sender: 'model', text: 'Jangan lupa makan malam ya nak.' }],
      maya: [{ sender: 'model', text: 'Halo, file pekerjaan kemarin sudah oke ya.' }]
    };

    // INITIALIZATION
    window.onload = function() {
      renderCharacterList();
      renderMissionSelector();
    };

    // SWITCH SCREEN
    function showScreen(screen) {
      const chatsScreen = document.getElementById('screen-chats');
      const roomScreen = document.getElementById('screen-room');
      const btnBack = document.getElementById('btn-back');

      if (screen === 'chats') {
        chatsScreen.classList.remove('hidden');
        roomScreen.classList.add('hidden');
        btnBack.classList.add('hidden');
        document.getElementById('header-title').textContent = "After Hours AU";
        document.getElementById('header-sub').textContent = `${MISSIONS[currentMission].title}: ${MISSIONS[currentMission].desc}`;
        activeCharId = null;
        renderCharacterList();
      } else if (screen === 'room') {
        chatsScreen.classList.add('hidden');
        roomScreen.classList.remove('hidden');
        btnBack.classList.remove('hidden');
      }
    }

    // RENDER LIST KONTAK
    function renderCharacterList() {
      const container = document.getElementById('character-list');
      container.innerHTML = '';

      Object.values(CHARACTERS).forEach(char => {
        const isUnlocked = currentMission >= char.unlockedAt;
        const lastMsg = chatHistories[char.id].slice(-1)[0]?.text || 'Belum ada pesan';

        const card = document.createElement('div');
        card.className = `p-3.5 bg-[#181a22] border border-white/5 rounded-2xl flex items-center justify-between cursor-pointer transition hover:border-indigo-500/30 ${!isUnlocked ? 'opacity-40 cursor-not-allowed' : ''}`;

        card.onclick = () => {
          if (isUnlocked) {
            openChatRoom(char.id);
          } else {
            alert(`Karakter ${char.name} belum bisa di-chat pada Misi ${currentMission}.`);
          }
        };

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="relative">
              <img src="${char.avatar}" class="w-11 h-11 rounded-full object-cover">
              ${!isUnlocked ? `<div class="absolute inset-0 bg-black/80 rounded-full flex items-center justify-center text-xs text-amber-400"><i class="fa-solid fa-lock"></i></div>` : ''}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-xs font-bold text-white">${char.name}</h3>
                <span class="text-[9px] bg-white/5 text-gray-400 px-1.5 py-0.5 rounded">${char.role}</span>
              </div>
              <p class="text-[11px] ${isUnlocked ? 'text-gray-400' : 'text-amber-500/80'} truncate max-w-[180px] mt-0.5">
                ${isUnlocked ? lastMsg : 'Terkunci'}
              </p>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-xs text-gray-600"></i>
        `;

        container.appendChild(card);
      });
    }

    // BUKA CHAT ROOM
    function openChatRoom(charId) {
      activeCharId = charId;
      const char = CHARACTERS[charId];

      document.getElementById('header-title').textContent = char.name;
      document.getElementById('header-sub').textContent = `${char.role} • Online`;

      showScreen('room');
      renderMessages();
    }

    // RENDER PESAN
    function renderMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      const history = chatHistories[activeCharId] || [];
      history.forEach(msg => {
        const isUser = msg.sender === 'user';
        const bubble = document.createElement('div');
        bubble.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

        bubble.innerHTML = `
          <div class="max-w-[80%] px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed ${isUser ? 'chat-bubble-user' : 'chat-bubble-model'}">
            ${msg.text}
          </div>
        `;
        container.appendChild(bubble);
      });

      container.scrollTop = container.scrollHeight;
    }

    // HANDLER KIRIM PESAN REAL KE NEXT.JS / GROQ API
    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeCharId) return;

      // Simpan pesan user
      chatHistories[activeCharId].push({ sender: 'user', text: text });
      input.value = '';
      renderMessages();

      document.getElementById('header-sub').textContent = "sedang mengetik...";

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            character: activeCharId,
            userMessage: text,
            history: chatHistories[activeCharId],
            currentMission: currentMission
          })
        });

        const data = await response.json();
        const replyText = data.reply || "Maaf, respon kosong.";

        chatHistories[activeCharId].push({ sender: 'model', text: replyText });
        document.getElementById('header-sub').textContent = `${CHARACTERS[activeCharId].role} • Online`;
        renderMessages();

      } catch (err) {
        chatHistories[activeCharId].push({ sender: 'model', text: "Error: Tidak terhubung ke server." });
        document.getElementById('header-sub').textContent = `${CHARACTERS[activeCharId].role} • Online`;
        renderMessages();
      }
    }

    // LOGIKA MODAL MISI
    function toggleMissionModal() {
      const modal = document.getElementById('mission-modal');
      modal.classList.toggle('hidden');
    }

    function renderMissionSelector() {
      const container = document.getElementById('mission-selector-list');
      container.innerHTML = '';

      Object.keys(MISSIONS).forEach(mNum => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-2 rounded-xl text-xs border transition ${parseInt(mNum) === currentMission ? 'bg-indigo-600/20 border-indigo-500 text-indigo-300 font-bold' : 'bg-white/5 border-transparent text-gray-400 hover:bg-white/10'}`;
        btn.textContent = `Misi ${mNum}: ${MISSIONS[mNum].desc}`;

        btn.onclick = () => {
          currentMission = parseInt(mNum);
          document.getElementById('mission-badge').textContent = `Misi ${currentMission} / 8`;
          document.getElementById('au-status-desc').textContent = MISSIONS[currentMission].desc;
          toggleMissionModal();
          renderCharacterList();
        };

        container.appendChild(btn);
      });
    }
  </script>
</body>
</html>
