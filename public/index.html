<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>After Hours - Phone Experience</title>
  <style>
    :root {
      --bg-dark: #000000;
      --ios-card: #1c1c1e;
      --ios-text: #ffffff;
      --ios-subtext: #8e8e93;
      --ios-accent: #2979ff;
      --wa-bg: #0b141a;
      --wa-header: #202c33;
      --wa-bubble-user: #005c4b;
      --wa-bubble-bot: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0f0f12;
      color: var(--ios-text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .iphone-frame {
      width: 385px;
      height: 800px;
      background: #000;
      border-radius: 50px;
      border: 4px solid #333;
      box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 4px rgba(255,255,255,0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background-color: #000;
      border-radius: 20px;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .dynamic-island.expanded {
      width: 320px;
      height: 65px;
      border-radius: 28px;
      padding: 12px 16px;
    }

    .di-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .di-title {
      font-size: 0.7rem;
      font-weight: 600;
      color: #fff;
    }

    .di-sub {
      font-size: 0.65rem;
      color: var(--ios-subtext);
    }

    .screen {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000;
      padding-top: 45px;
    }

    .screen.active {
      display: flex;
    }

    .homescreen {
      background: linear-gradient(180deg, #1e1e24 0%, #08080a 100%);
      padding: 60px 24px 24px 24px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .app-icon-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Logo Aplikasi Tanpa Emoji */
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.8rem;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .app-name {
      font-size: 0.7rem;
      color: #fff;
    }

    .icon-wa { background: #25D366; }
    .icon-tiktok { background: #000000; border: 1px solid #333; }
    .icon-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .icon-x { background: #000000; border: 1px solid #333; font-weight: 900; }

    .app-header {
      height: 50px;
      background-color: var(--ios-card);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border-bottom: 0.5px solid #2c2c2e;
    }

    .back-btn {
      color: var(--ios-accent);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid #1c1c1e;
      gap: 12px;
      cursor: pointer;
    }

    .chat-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-info {
      flex: 1;
    }

    .chat-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .chat-preview {
      font-size: 0.8rem;
      color: var(--ios-subtext);
      margin-top: 2px;
    }

    .chat-detail {
      background-color: var(--wa-bg);
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .bubble.user {
      align-self: flex-end;
      background-color: var(--wa-bubble-user);
    }

    .bubble.bot {
      align-self: flex-start;
      background-color: var(--wa-bubble-bot);
    }

    .chat-input-bar {
      padding: 8px 12px;
      background-color: var(--wa-header);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: #111b21;
      border: none;
      border-radius: 18px;
      padding: 8px 14px;
      color: white;
      outline: none;
      font-size: 0.85rem;
    }

    .send-btn {
      background-color: #00a884;
      border: none;
      color: white;
      padding: 0 14px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .feed-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ios-subtext);
      font-size: 0.85rem;
      padding: 20px;
      text-align: center;
    }

    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background-color: #fff;
      border-radius: 2px;
      z-index: 9999;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="iphone-frame">
    <!-- Dynamic Island -->
    <div class="dynamic-island" id="dynamic-island" onclick="toggleIsland()">
      <div class="di-content">
        <div>
          <div class="di-title" id="di-title">Misi 1</div>
          <div class="di-sub" id="di-sub">Salah Kirim Boba</div>
        </div>
      </div>
    </div>

    <!-- Homescreen -->
    <div class="screen homescreen active" id="screen-home">
      <div class="app-grid">
        <div class="app-icon-wrapper" onclick="openApp('wa')">
          <div class="app-icon icon-wa">WA</div>
          <span class="app-name">WhatsApp</span>
        </div>
        <div class="app-icon-wrapper" onclick="openApp('tiktok')">
          <div class="app-icon icon-tiktok">TikTok</div>
          <span class="app-name">TikTok</span>
        </div>
        <div class="app-icon-wrapper" onclick="openApp('ig')">
          <div class="app-icon icon-ig">IG</div>
          <span class="app-name">Instagram</span>
        </div>
        <div class="app-icon-wrapper" onclick="openApp('x')">
          <div class="app-icon icon-x">X</div>
          <span class="app-name">X</span>
        </div>
      </div>
    </div>

    <!-- WhatsApp List -->
    <div class="screen" id="screen-wa">
      <div class="app-header">
        <span class="back-btn" onclick="goHome()">Home</span>
        <span style="font-weight: 600; font-size: 1rem;">Pesan</span>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- Chat Detail -->
    <div class="screen chat-detail" id="screen-chat">
      <div class="app-header" style="background-color: var(--wa-header);">
        <span class="back-btn" onclick="openApp('wa')">Kembali</span>
        <div class="chat-info">
          <div class="chat-name" id="active-chat-name">Rian</div>
          <div class="chat-preview" style="color: #00a884;">Online</div>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" id="message-input" placeholder="Ketik pesan..." />
        <button class="send-btn" onclick="sendMessage()">Kirim</button>
      </div>
    </div>

    <!-- Apps Lain -->
    <div class="screen" id="screen-tiktok">
      <div class="app-header">
        <span class="back-btn" onclick="goHome()">Home</span>
        <span style="font-weight: 600;">TikTok</span>
      </div>
      <div class="feed-placeholder">
        Feed TikTok belum tersedia di Misi ini. Periksa pesan WhatsApp kamu!
      </div>
    </div>

    <div class="screen" id="screen-ig">
      <div class="app-header">
        <span class="back-btn" onclick="goHome()">Home</span>
        <span style="font-weight: 600;">Instagram</span>
      </div>
      <div class="feed-placeholder">
        Belum ada update postingan baru.
      </div>
    </div>

    <div class="screen" id="screen-x">
      <div class="app-header">
        <span class="back-btn" onclick="goHome()">Home</span>
        <span style="font-weight: 600;">X</span>
      </div>
      <div class="feed-placeholder">
        Postingan X terhubung dengan alur cerita pada Misi 2.
      </div>
    </div>

    <div class="home-bar" onclick="goHome()"></div>
  </div>

  <script>
    let currentMission = 1;
    let activeCharacter = 'rian';
    const chatHistories = { rian: [], dimas: [], siti: [], maya: [], ibu: [] };

    const MISSION_DATA = {
      1: { name: "Salah Kirim Boba", unlocked: ['rian'] },
      2: { name: "Chat WhatsApp & Post X", unlocked: ['rian', 'siti'] },
      3: { name: "Martabak Ojol", unlocked: ['rian', 'siti', 'dimas'] },
      4: { name: "Panggilan Pertama", unlocked: ['rian', 'dimas', 'ibu'] },
      5: { name: "Janjian Kopi Nanti", unlocked: ['rian', 'dimas', 'siti', 'maya'] },
      6: { name: "Pasca Kencan", unlocked: ['rian', 'dimas', 'siti', 'maya', 'ibu'] },
      7: { name: "Klir dengan Maya", unlocked: ['rian', 'dimas', 'siti', 'maya', 'ibu'] },
      8: { name: "Kencan Pantai Senja", unlocked: ['rian', 'dimas', 'siti', 'maya', 'ibu'] }
    };

    const CHARACTERS = [
      { id: 'rian', name: 'Rian Pratama', bio: 'Desainer Grafis' },
      { id: 'siti', name: 'Siti', bio: 'Sahabat' },
      { id: 'dimas', name: 'Dimas', bio: 'Sahabat Rian' },
      { id: 'maya', name: 'Maya', bio: 'Rekan Kerja' },
      { id: 'ibu', name: 'Ibu', bio: 'Orang Tua' }
    ];

    function updateDynamicIsland() {
      const data = MISSION_DATA[currentMission];
      document.getElementById('di-title').textContent = `Misi ${currentMission}`;
      document.getElementById('di-sub').textContent = data.name;
    }

    function toggleIsland() {
      document.getElementById('dynamic-island').classList.toggle('expanded');
    }

    function goHome() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-home').classList.add('active');
    }

    function openApp(app) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      if (app === 'wa') {
        renderChatList();
        document.getElementById('screen-wa').classList.add('active');
      } else {
        document.getElementById(`screen-${app}`).classList.add('active');
      }
    }

    function renderChatList() {
      const list = document.getElementById('chat-list');
      list.innerHTML = '';
      const unlockedList = MISSION_DATA[currentMission].unlocked;

      CHARACTERS.forEach(c => {
        const isUnlocked = unlockedList.includes(c.id);
        const item = document.createElement('div');
        item.className = `chat-item ${isUnlocked ? '' : 'locked'}`;
        
        item.innerHTML = `
          <div class="avatar">${c.name.charAt(0)}</div>
          <div class="chat-info">
            <div class="chat-name">${c.name}</div>
            <div class="chat-preview">${isUnlocked ? c.bio : 'Terkunci (Selesaikan misi)'}</div>
          </div>
        `;

        if (isUnlocked) {
          item.onclick = () => startChat(c.id, c.name);
        }

        list.appendChild(item);
      });
    }

    function startChat(charId, charName) {
      activeCharacter = charId;
      document.getElementById('active-chat-name').textContent = charName;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-chat').classList.add('active');
      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('chat-messages');
      box.innerHTML = '';
      const history = chatHistories[activeCharacter] || [];

      history.forEach(m => {
        const bubble = document.createElement('div');
        bubble.className = `bubble ${m.sender === 'user' ? 'user' : 'bot'}`;
        bubble.textContent = m.text; // Emoji di izinkan di sini
        box.appendChild(bubble);
      });

      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      chatHistories[activeCharacter].push({ sender: 'user', text: text });
      input.value = '';
      renderMessages();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            character: activeCharacter,
            userMessage: text,
            history: chatHistories[activeCharacter],
            currentMission: currentMission
          })
        });

        const data = await response.json();
        if (data.reply) {
          chatHistories[activeCharacter].push({ sender: activeCharacter, text: data.reply });
          renderMessages();
        }
      } catch (err) {
        chatHistories[activeCharacter].push({ sender: activeCharacter, text: "Gagal terhubung ke server." });
        renderMessages();
      }
    }

    // Inisialisasi
    updateDynamicIsland();
  </script>
</body>
</html>
